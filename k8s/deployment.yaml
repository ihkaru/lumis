apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumis-deployment
  namespace: lumis-system
  labels:
    app.kubernetes.io/name: lumis
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lumis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: lumis
          image: ghcr.io/ipds6104/lumis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lumis-config
            - secretRef:
                name: lumis-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/db
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
