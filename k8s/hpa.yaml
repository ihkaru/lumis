apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumis-hpa
  namespace: lumis-system
  labels:
    app.kubernetes.io/name: lumis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumis-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
