services:
  lumis:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumis:latest
    container_name: lumis-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=sqlite:///data/lumis.sqlite?mode=rwc
      - TRUSTED_HEADER=x-forwarded-user
      - RUST_LOG=lumis_server=info,tower_http=info
      # Multi-Provider Resilient LLM Router configuration
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BACKUP_API_BASE=${LLM_BACKUP_API_BASE:-}
      - LLM_BACKUP_API_KEY=${LLM_BACKUP_API_KEY:-}
      # Telemetry & Sentry Exporter (Optional)
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - lumis-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  lumis-data:
    driver: local
